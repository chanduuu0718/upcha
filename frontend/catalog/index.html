<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Upcha product search — find products by Product ID or keyword.">
  <title>Upcha — Product Search</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">Upcha</div>
    <div class="brand-subtitle">Product discovery</div>
  </header>

  <main class="page">
    <section class="hero">
      <p class="eyebrow">UPCHA</p>
      <h1>Find your product</h1>
      <p class="hero-copy">Search by Product ID or keyword to view the product details, poster and shopping link.</p>
      <form id="search-form" class="search-form" role="search">
        <label class="sr-only" for="search-input">Product ID or keyword</label>
        <input id="search-input" type="search" placeholder="Enter Product ID or search keyword" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <p class="hint">Example: <strong>UP001</strong> or <strong>white sneakers</strong></p>
    </section>

    <section id="results" class="results" aria-live="polite"></section>

    <section id="empty-state" class="empty-state">
      <div class="empty-icon">⌕</div>
      <h2>Search for a product</h2>
      <p>Enter a Product ID or keyword above to get started.</p>
    </section>
  </main>

  <footer class="footer">© Upcha · Product information and shopping links</footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
