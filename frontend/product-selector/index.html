<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upcha — Product Selector</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <p class="eyebrow">UPCHA · V1</p>
        <h1>Select a Myntra product</h1>
        <p class="subtitle">Paste a Myntra product URL to prepare it for the ExtraPe → Pinterest workflow.</p>

        <form id="product-form">
          <label for="myntra-url">Myntra product URL</label>
          <div class="url-row">
            <input id="myntra-url" name="url" type="url" placeholder="https://www.myntra.com/..." required />
            <button type="submit">Fetch product</button>
          </div>
          <p id="error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="preview" class="card preview hidden" aria-live="polite">
        <div class="preview-placeholder" id="image-placeholder">Product image</div>
        <div class="preview-content">
          <p class="eyebrow">PRODUCT PREVIEW</p>
          <h2 id="product-name">—</h2>
          <p id="product-url" class="muted">—</p>
          <dl>
            <div><dt>Price</dt><dd id="product-price">—</dd></div>
            <div><dt>Category</dt><dd id="product-category">—</dd></div>
          </dl>
          <button id="select-product" type="button">Select product</button>
        </div>
      </section>

      <section id="selected" class="card success hidden">
        <strong>Product selected ✓</strong>
        <p id="selected-message"></p>
        <p class="muted">Next: connect this product to the ExtraPe conversion service.</p>
      </section>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
